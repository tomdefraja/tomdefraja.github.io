<a href="{{ include.photo.image | relative_url }}" 
   class="photo_container bg"
   data-src="{{ include.photo.image | relative_url }}"
   style="background-image: url('{{ include.photo.image | relative_url }}');">
  <h1 class="photo_overlay1">
    {{ include.photo.title }}
    <span class="photo_overlay_date"><i>{{ include.photo.date | date: '%B %Y' }}</i></span>
  </h1>
</a>

<script src="{{ '/assets/js/photography-tabs.js' | relative_url }}"></script>
