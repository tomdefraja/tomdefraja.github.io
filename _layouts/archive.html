---
layout: default
---

<div class="page-header">
  {% if page.title %}
    <h1 class="page__title">{{ page.title | markdownify | remove: "<p>" | remove: "</p>" }}</h1>
  {% endif %}
  {% if page.page_icon %}
    <img class="page-header__graphic" src="{{ page.page_icon | relative_url }}" alt="">
  {% endif %}
  {% if page.subtitle %}
    <p class="page__subtitle">{{ page.subtitle }}</p>  {% endif %}
</div>

<div class="page-content">
  <div class="archive">    {{ content }}
  </div>
</div>
