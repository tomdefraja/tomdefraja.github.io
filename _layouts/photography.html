---
layout: default
---

<div class="page-header">
  {% if page.page_icon %}
    <img class="page-header__graphic" src="{{ page.page_icon | relative_url }}" alt="">
  {% endif %}
  <h1 class="page__title">{{ page.title | markdownify | remove: "<p>" | remove: "</p>" }}</h1>
  {% if page.subtitle %}
    <p class="page__subtitle">{{ page.subtitle }}</p>
  {% endif %}
</div>

<div class="page-content">
  <!-- photography content / tabs go here unchanged -->
  {{ content }}
</div>

<script src="{{ '/assets/js/blog-tabs.js' | relative_url }}"></script>
