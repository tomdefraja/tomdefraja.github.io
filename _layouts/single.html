---
layout: default
---

<div class="page-header">
  {% if page.title %}
    <h1 class="page__title">{{ page.title | markdownify | remove: "<p>" | remove: "</p>" }}</h1>
  {% endif %}
  {% if page.page_icon %}
    <img class="page-header__graphic {% if page.page_icon_large %}page-header__graphic--large{% endif %}" src="{{ page.page_icon | relative_url }}" alt="">  {% endif %}
  {% if page.subtitle %}
    <p class="page__subtitle">{{ page.subtitle }}</p>
  {% endif %}
</div>

<div class="page-content">
  <article itemscope itemtype="http://schema.org/CreativeWork">
    {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
    <section itemprop="text">
      {{ content }}
    </section>
    {% include page__taxonomy.html %}
  </article>
</div>
